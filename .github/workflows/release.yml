name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-zxp:
    # windows-latest is required: bolt-cep bundles a Windows/macOS ZXPSignCmd
    # (the "unix" binary is Mach-O, not a Linux ELF), so signing cannot run on
    # ubuntu. Windows uses the bundled ZXPSignCmd.exe.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn zxp
      # Guard against symbol elision (P02a ReferenceError) before releasing.
      - run: yarn smoke
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/zxp/*.zxp
